name: Погода на завтра — автопостинг

# Пост публикуется на серверах GitHub — ваш компьютер может быть выключен.
# ВАЖНО: время в расписании указано в UTC (Москва = UTC+3).
#
# Расписание — «best effort»: GitHub Actions может не только задержать, но и
# совсем потерять запуск (так было 20–21.11.2026: планировщик GitHub не
# зарегистрировал cron, event=schedule — 0 запусков). Поэтому запусков четыре:
# основной + три страховки. Дублей не будет: после успешной публикации этот же
# workflow загружает артефакт-маркер posted-<дата>-bot<N> (файл создаёт бот),
# а перед публикацией бот проверяет наличие маркера через GitHub API. Если у
# токена хватает прав, дополнительно проверяется и стена группы (wall.get) —
# но групповому токену ВК этот метод недоступен (VK API 27), поэтому маркер —
# основная защита. Артефакты-маркеры живут 7 дней и видны во вкладке Actions
# → Artifacts.
#
#   14:15 МСК — основной запуск: создаёт ОТЛОЖЕННЫЙ пост (publish_date),
#               который ВКонтакте публикует ровно в 19:00 МСК;
#   16:25 МСК — страховка №1: успеет в 19:00, если основной запуск потерян;
#   18:35 МСК — страховка №2: последний момент отсрочки до 19:00;
#   19:45 МСК — последняя надежда: пост выйдет сразу (поздно, но выйдет).
#
# Если GitHub-планировщик не регистрирует cron (см. выше), ежедневный запуск
# можно поручить внешнему сервису (например, cron-job.org): он дёргает
# workflow_dispatch API с inputs mode=scheduled — сработает ветка --scheduled
# (отложенный пост к 19:00 МСК, дубли исключены маркером-артефактом).
# Cron стоит не в начале часа — тогда у GitHub Actions самые большие очереди.
#
# Логика запуска (bot/index.js --scheduled): schedule у GitHub срабатывает
# с опозданием до 5–14 часов, запуски прилетают в том числе ночью (21:00–06:00 МСК).
# Поэтому окно отсрочки — 24 часа (DEFER_WINDOW_MS в bot/index.js):
#   любой запуск до 19:00 МСК (и ночной тоже) — создаёт ОТЛОЖЕННЫЙ пост
#                           (publish_date), который ВКонтакте публикует ровно в 19:00 МСК;
#   уже после 19:00 МСК   — пост публикуется сразу.
# Если меняете cron: время запуска не критично — любой запуск до POST_TIME создаст
# отложенный пост; дубли исключены маркером-артефактом.
on:
  schedule:
    - cron: "15 11 * * *"   # 14:15 МСК — основной
    - cron: "25 13 * * *"   # 16:25 МСК — страховка №1
    - cron: "35 15 * * *"   # 18:35 МСК — страховка №2
    - cron: "45 16 * * *"   # 19:45 МСК — публикация сразу, если ничего нет
  # Ручной запуск из вкладки Actions на GitHub
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим"
        required: true
        default: "post"
        type: choice
        options:
          - post
          - test
          - scheduled
          - refresh
      force:
        description: "Опубликовать, даже если пост сегодня уже выходил (пропустить проверку дублей)"
        required: false
        default: false
        type: boolean
      post_ids:
        description: "refresh: ID отложенных постов через запятую, по порядку ботов (из лога запуска, который их создал)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read   # чтение артефактов-маркеров «пост сегодня уже выходил»

# Запуски не выполняются параллельно: два одновременных запуска могут пройти
# проверку маркера до загрузки артефакта и задублировать пост
concurrency:
  group: weather-post
  cancel-in-progress: false

jobs:
  post-weather:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Получить код
        uses: actions/checkout@v5

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Установить зависимости
        run: npm ci

      - name: Погода и публикация
        env:
          # Значения берутся из Secrets репозитория (Settings → Secrets and variables → Actions)
          # Бот 1 — без суффикса, боты 2-5 — с суффиксом _2, _3, _4, _5
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          CITY: ${{ secrets.CITY }}
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
          VK_TOKEN_2: ${{ secrets.VK_TOKEN_2 }}
          VK_GROUP_ID_2: ${{ secrets.VK_GROUP_ID_2 }}
          CITY_2: ${{ secrets.CITY_2 }}
          LAT_2: ${{ secrets.LAT_2 }}
          LON_2: ${{ secrets.LON_2 }}
          VK_TOKEN_3: ${{ secrets.VK_TOKEN_3 }}
          VK_GROUP_ID_3: ${{ secrets.VK_GROUP_ID_3 }}
          CITY_3: ${{ secrets.CITY_3 }}
          VK_TOKEN_4: ${{ secrets.VK_TOKEN_4 }}
          VK_GROUP_ID_4: ${{ secrets.VK_GROUP_ID_4 }}
          CITY_4: ${{ secrets.CITY_4 }}
          VK_TOKEN_5: ${{ secrets.VK_TOKEN_5 }}
          VK_GROUP_ID_5: ${{ secrets.VK_GROUP_ID_5 }}
          CITY_5: ${{ secrets.CITY_5 }}
          # Для маркера «пост сегодня уже выходил»: проверка артефактов и дата загрузки
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          if [ "${{ github.event.inputs.mode }}" = "test" ]; then
            echo "=== ТЕСТ (без публикации) ==="
            node index.js --test
          elif [ "${{ github.event.inputs.mode }}" = "post" ]; then
            # Ручной запуск — опубликовать сразу
            node index.js --now $FORCE_FLAG
          elif [ "${{ github.event.inputs.mode }}" = "scheduled" ]; then
            # Запуск от внешнего планировщика (cron-job.org и т.п.):
            # как по расписанию — отложенный пост к 19:00 МСК, дубли исключены
            node index.js --scheduled $FORCE_FLAG
          elif [ "${{ github.event.inputs.mode }}" = "refresh" ]; then
            # Обновить УЖЕ созданные отложенные посты: текст пересоберётся
            # с текущим прогнозом, время выхода (POST_TIME) не изменится
            node index.js --refresh --post-ids="${{ github.event.inputs.post_ids }}"
          else
            # Запуск по расписанию — отложенный пост, выйдет в 19:00 МСК
            node index.js --scheduled $FORCE_FLAG
          fi

      # Дата (по Москве) для имён артефактов-маркеров — та же функция, что в боте
      - name: Дата маркера (по Москве)
        if: always()
        run: echo "TODAY_MSK=$(TZ=Europe/Moscow date +%F)" >> "$GITHUB_ENV"

      # Артефакт-маркер «пост сегодня уже выходил»: бот создаёт файл после
      # успешной публикации, workflow загружает его. Каждый шаг грузит артефакт
      # только если файл этого бота существует (bot/index.js → writeMarkerFile).
      - name: Маркер «пост вышел» — бот 1
        if: always() && hashFiles('bot/markers/posted-bot1.txt') != ''
        uses: actions/upload-artifact@v6
        with:
          name: posted-${{ env.TODAY_MSK }}-bot1
          path: bot/markers/posted-bot1.txt
          retention-days: 7
      - name: Маркер «пост вышел» — бот 2
        if: always() && hashFiles('bot/markers/posted-bot2.txt') != ''
        uses: actions/upload-artifact@v6
        with:
          name: posted-${{ env.TODAY_MSK }}-bot2
          path: bot/markers/posted-bot2.txt
          retention-days: 7
      - name: Маркер «пост вышел» — бот 3
        if: always() && hashFiles('bot/markers/posted-bot3.txt') != ''
        uses: actions/upload-artifact@v6
        with:
          name: posted-${{ env.TODAY_MSK }}-bot3
          path: bot/markers/posted-bot3.txt
          retention-days: 7
      - name: Маркер «пост вышел» — бот 4
        if: always() && hashFiles('bot/markers/posted-bot4.txt') != ''
        uses: actions/upload-artifact@v6
        with:
          name: posted-${{ env.TODAY_MSK }}-bot4
          path: bot/markers/posted-bot4.txt
          retention-days: 7
      - name: Маркер «пост вышел» — бот 5
        if: always() && hashFiles('bot/markers/posted-bot5.txt') != ''
        uses: actions/upload-artifact@v6
        with:
          name: posted-${{ env.TODAY_MSK }}-bot5
          path: bot/markers/posted-bot5.txt
          retention-days: 7
