name: probe-defaults
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Режим"
        required: true
        default: "post"
        type: choice
        options:
          - post
          - test
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Показать значения входов
        run: |
          echo "github.event.inputs.mode=[${{ github.event.inputs.mode }}]"
          echo "inputs.mode=[${{ inputs.mode }}]"
